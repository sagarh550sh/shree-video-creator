name: shree_video_creator
description: A modern, fast and simple video editing application for creating amazing videos on Android.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Material
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # State Management & Providers
  provider: ^6.1.0
  
  # Media & File Handling
  image_picker: ^1.0.7
  video_player: ^2.8.1
  path_provider: ^2.1.1
  permission_handler: ^11.4.4
  file_picker: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
